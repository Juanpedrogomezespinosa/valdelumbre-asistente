<a
  href="#main"
  class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:rounded focus:bg-surface focus:px-4 focus:py-2"
  (click)="skipToMain($event)"
  >{{ i18n.texts().skipToContent }}</a
>

<header class="border-b border-control-border bg-surface">
  <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-4 px-4 py-3">
    <a routerLink="/" class="text-xl font-bold text-text no-underline">{{
      i18n.texts().siteName
    }}</a>
    <nav [attr.aria-label]="i18n.texts().nav.label">
      <ul class="flex gap-6">
        <li>
          <a
            routerLink="/"
            routerLinkActive="font-bold"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
            >{{ i18n.texts().nav.assistant }}</a
          >
        </li>
        <li>
          <a routerLink="/pois" routerLinkActive="font-bold" ariaCurrentWhenActive="page">{{
            i18n.texts().nav.pois
          }}</a>
        </li>
      </ul>
    </nav>
    <app-language-switcher />
  </div>
</header>

<main #main id="main" tabindex="-1" class="mx-auto max-w-5xl px-4 py-8 focus:outline-none">
  <router-outlet />
</main>
