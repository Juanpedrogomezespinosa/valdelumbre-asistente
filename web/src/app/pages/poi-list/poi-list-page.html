@let texts = i18n.texts();
@let active = filters();
<app-page-heading>{{ texts.pages.pois }}</app-page-heading>

<form class="mb-6 rounded-lg border border-control-border bg-surface p-4">
  <fieldset class="flex flex-wrap items-end gap-6">
    <legend class="mb-3 font-semibold">{{ texts.poiList.filters }}</legend>

    <div class="flex flex-col gap-1">
      <label for="category">{{ texts.poi.category }}</label>
      <select
        id="category"
        class="rounded border border-control-border bg-surface px-2 py-1"
        (change)="chooseCategory($event)"
      >
        <option value="" [selected]="active.category === null">
          {{ texts.poiList.anyCategory }}
        </option>
        @for (category of categories; track category) {
          <option [value]="category" [selected]="active.category === category">
            {{ texts.categories[category] }}
          </option>
        }
      </select>
    </div>

    <div class="flex flex-col gap-1">
      <label for="accessibility">{{ texts.poi.accessibility }}</label>
      <select
        id="accessibility"
        class="rounded border border-control-border bg-surface px-2 py-1"
        (change)="chooseAccessibility($event)"
      >
        <option value="" [selected]="active.accessible === null">
          {{ texts.poiList.anyAccessibility }}
        </option>
        <option value="true" [selected]="active.accessible === true">
          {{ texts.poiList.onlyAccessible }}
        </option>
        <option value="false" [selected]="active.accessible === false">
          {{ texts.poiList.onlyNotAccessible }}
        </option>
      </select>
    </div>

    <div class="flex items-center gap-2 py-1">
      <input
        id="open-now"
        type="checkbox"
        class="size-5 accent-primary"
        [checked]="active.openNow"
        (change)="toggleOpenNow($event)"
      />
      <label for="open-now">{{ texts.poiList.openNow }}</label>
    </div>
  </fieldset>
</form>

<p role="status" class="mb-4 font-medium">{{ status() }}</p>

@if (results.hasValue()) {
  <ul class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    @for (poi of results.value(); track poi.id) {
      <li><app-poi-card [poi]="poi" /></li>
    }
  </ul>
}
