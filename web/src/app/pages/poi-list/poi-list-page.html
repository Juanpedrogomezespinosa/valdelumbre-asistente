@let texts = i18n.texts();
@let active = filters();
<app-page-heading>{{ texts.pages.pois }}</app-page-heading>

<form class="mb-8 rounded-2xl bg-sunk p-5 sm:p-6">
  <fieldset class="flex flex-wrap items-end gap-x-6 gap-y-4">
    <legend class="mb-3 text-xs font-semibold tracking-[0.12em] text-muted uppercase">
      {{ texts.poiList.filters }}
    </legend>

    <div class="flex flex-col gap-1">
      <label for="category" class="text-sm font-semibold">{{ texts.poi.category }}</label>
      <select
        id="category"
        class="rounded-lg border border-control-border bg-surface px-3 py-2"
        (change)="chooseCategory($event)"
      >
        <option value="" [selected]="active.category === null">
          {{ texts.poiList.anyCategory }}
        </option>
        @for (category of categories; track category) {
          <option [value]="category" [selected]="active.category === category">
            {{ texts.categories[category] }}
          </option>
        }
      </select>
    </div>

    <div class="flex flex-col gap-1">
      <label for="accessibility" class="text-sm font-semibold">{{ texts.poi.accessibility }}</label>
      <select
        id="accessibility"
        class="rounded-lg border border-control-border bg-surface px-3 py-2"
        (change)="chooseAccessibility($event)"
      >
        <option value="" [selected]="active.accessible === null">
          {{ texts.poiList.anyAccessibility }}
        </option>
        <option value="true" [selected]="active.accessible === true">
          {{ texts.poiList.onlyAccessible }}
        </option>
        <option value="false" [selected]="active.accessible === false">
          {{ texts.poiList.onlyNotAccessible }}
        </option>
      </select>
    </div>

    <div class="flex items-center gap-2 py-2">
      <input
        id="open-now"
        type="checkbox"
        class="size-5 accent-primary"
        [checked]="active.openNow"
        (change)="toggleOpenNow($event)"
      />
      <label for="open-now" class="font-semibold">{{ texts.poiList.openNow }}</label>
    </div>
  </fieldset>
</form>

<p role="status" class="mb-5 font-display text-xl">{{ status() }}</p>

@if (results.hasValue()) {
  <ul class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
    @for (poi of results.value(); track poi.id) {
      <li><app-poi-card [poi]="poi" /></li>
    }
  </ul>
}
