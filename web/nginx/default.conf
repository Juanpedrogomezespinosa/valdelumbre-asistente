server {
    listen 8080;
    root /usr/share/nginx/html;

    # Same contract as the dev proxy (proxy.conf.json): /api/pois -> api:8000/pois.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }

    # Client-side routes (/pois/poi-003) are served by the Angular app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
